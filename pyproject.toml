[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laogu-mcp"
version = "1.0.1"
description = "老谷拆财报 MCP Server：16 个 A 股财经 skill 的程序化数据层（零 key、纯公开接口）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "老谷拆财报" }]
keywords = ["mcp", "a-share", "china-stock", "finance"]
dependencies = ["fastmcp>=2.0", "httpx>=0.27"]
# 说明：抓取层只用 Python 标准库 urllib（无 pandas/akshare 重依赖），httpx 仅为 FastMCP 传递依赖。

[project.scripts]
laogu-mcp = "laogu_mcp.server:main"

[project.urls]
Homepage = "https://github.com/laogu-caibao/laogu-mcp"
Repository = "https://github.com/laogu-caibao/laogu-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/laogu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
