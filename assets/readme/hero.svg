    <text class="sans" x="56" y="232" font-size="20" fill="#C9C2B8">key、零登录、零配置。</text>

    <rect x="56" y="258" width="600" height="52" rx="10" fill="#1B1713" stroke="#10B981" stroke-width="1.5"/>
    <text class="mono" x="76" y="291" font-size="18" fill="#10B981">uvx laogu-mcp</text>

    <text class="sans" x="56" y="352" font-size="17" fill="#9A938A">v1.1.1 · 16 tools · Python 3.10+ · MIT</text>
  </g>

