      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0F1512"/>
  <line x1="688" y1="48" x2="688" y2="372" stroke="#2A251F" stroke-width="1.5"/>

  <!-- 左：标题区 -->
  <g id="title-block">
    <text class="mono" x="56" y="80" font-size="17" letter-spacing="2" fill="#10B981">LAOGU-CAIBAO · AI SKILL</text>
    <text class="sans" x="56" y="132" font-size="40" font-weight="700" fill="#F5F0E8">laogu-mcp</text>
