  <title id="title">老谷拆财报 MCP Server — laogu-mcp</title>
  <desc id="desc">laogu-mcp — 老谷拆财报 MCP Server：16 个财经数据 tool 的程序化数据层，零 key、零登录、零配置。</desc>

  <defs>
    <style>
